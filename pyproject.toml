# Tool configuration only. Dependencies are managed via requirements*.txt (pip),
# not through this file — see requirements.txt / requirements-dev.txt.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py313"
# Exploratory notebook cells (loose cell-order variable reuse, deliberate prints) would
# trip lint rules for reasons unrelated to code quality. research/lib/*.py is real
# reusable code and stays fully linted.
extend-exclude = ["research/*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
