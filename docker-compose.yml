# Local dev stack. Day 1 uses only the `api` service, but `db` (Postgres + pgvector)
# comes up too so the full documented infrastructure is proven early. The classification
# stage (Week 1) will store ATT&CK-for-ICS technique embeddings in it.

services:
  api:
    build: .
    container_name: cti-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://cti:cti@db:5432/cti
      SPACY_MODEL: en_core_web_sm
    volumes:
      # Mount source for hot-reload during development.
      - ./app:/app/app
      - ./data:/app/data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      db:
        condition: service_healthy

  db:
    image: pgvector/pgvector:pg16
    container_name: cti-db
    environment:
      POSTGRES_USER: cti
      POSTGRES_PASSWORD: cti
      POSTGRES_DB: cti
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cti -d cti"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
